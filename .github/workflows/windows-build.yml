name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Tests de Ibada.Core
        run: dotnet run --project windows/Ibada.Core.Tests -c Release
      - name: Compilation de l'application WPF
        run: dotnet build windows/Ibada.App -c Release
      - name: Publication (sans installation de .NET)
        run: dotnet publish windows/Ibada.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Ibada-windows-x64
          path: publish/Ibada.exe
          retention-days: 30
