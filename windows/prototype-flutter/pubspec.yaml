name: ibada_prototype
description: Prototype V0 Ibada — fenêtre de projection (Flutter Windows)
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.3.9        # gestion des fenêtres multiples
  video_player: ^2.8.6          # lecture vidéo
  video_player_win: ^2.3.5      # backend Windows pour video_player
  multi_window: ^0.0.2          # (optionnel) fenêtre secondaire
  screen_retriever: ^0.1.9      # détection des écrans

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/test-video.mp4     # remplacer par une vidéo du domaine public
